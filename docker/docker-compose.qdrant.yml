services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_profit
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + gRPC HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334

volumes:
  qdrant_storage:
    driver: local
